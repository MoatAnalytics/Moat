name: Weekly Stock Data Update

on:
  schedule:
    # Runs every Saturday at 06:00 UTC
    - cron: '0 6 * * 6'
  # Allows you to manually trigger it from the Actions tab anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run Python update script
        run: python update_data.py

      - name: Commit and push changes if data updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated weekly stock data update [skip ci]"
          file_pattern: data.json
